# Blueprint de Render: crea la base PostgreSQL y el servicio web desde este repo.
# Guía paso a paso: docs/publicar.md
#
# Plan gratis: el servicio se duerme tras 15 minutos sin uso (tarda ~1 minuto en
# despertar) y la base gratis vence a los 30 días. Para uso real, pasar ambos a pago.

services:
  - type: web
    name: centro-integral
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: centro-integral-db
          property: connectionString
      # Firma de los tokens: Render genera un valor al azar.
      - key: JWT_SECRET
        generateValue: true
      # Primer superadmin: Render los pide al crear el Blueprint (no quedan en git).
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      # Datos demo (dos centros y un usuario por rol). Para un ambiente real: "false".
      - key: CARGAR_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        sync: false

databases:
  - name: centro-integral-db
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    databaseName: centro_integral
    user: centro
