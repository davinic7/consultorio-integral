<main class="oc-contenido elegir">
  <section class="oc-tarjeta">
    <h1>Elegí un centro</h1>
    <p class="oc-suave">Trabajás en más de un centro. ¿Con cuál querés entrar?</p>

    <ul class="elegir__lista">
      @for (centro of auth.sesion()?.centros ?? []; track centro.id) {
        <li>
          <button
            type="button"
            class="oc-btn oc-tarjeta--interactiva elegir__centro"
            [disabled]="eligiendo() !== null"
            (click)="elegir(centro.id)"
          >
            <strong>{{ centro.nombre }}</strong>
            <span class="oc-suave">{{ nombreRol[centro.rol] }}</span>
          </button>
        </li>
      }
    </ul>

    @if (error()) {
      <p class="oc-alerta oc-alerta--error" role="alert">No se pudo entrar a ese centro. Probá de nuevo.</p>
    }
  </section>
</main>
