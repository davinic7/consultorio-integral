<main class="pagina pagina--centrada">
  <form class="tarjeta" [formGroup]="form" (ngSubmit)="entrar()" novalidate>
    <h1>Centro Integral</h1>
    <p class="sutil">Ingresá con tu cuenta</p>

    <label class="campo">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="username" inputmode="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="campo__error">Ingresá un email válido.</small>
      }
    </label>

    <label class="campo">
      <span>Contraseña</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="campo__error">Ingresá tu contraseña.</small>
      }
    </label>

    @if (error(); as mensaje) {
      <p class="aviso aviso--error" role="alert">{{ mensaje }}</p>
    }

    <button type="submit" class="boton" [disabled]="enviando()">
      {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>
</main>
