<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Centro Integral</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- La tipografía principal se pide enseguida, para que el texto no cambie al cargar. -->
    <link
      rel="preload"
      href="fuentes/sora-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" type="image/svg+xml" href="marca/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Tema elegido antes de que cargue la app, para que no parpadee (ver core/tema.service.ts).
      try {
        var t = localStorage.getItem('ci-tema');
        if (t === 'claro' || t === 'oscuro') document.documentElement.setAttribute('data-tema', t);
      } catch (e) {}
    </script>
  </head>
  <body class="oc-app">
    <app-root></app-root>
  </body>
</html>
